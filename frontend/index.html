<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hace tu pedido | SIA</title>

    <link rel="stylesheet" href="/static/styles.css?v=20260917-2">
</head>

<body>
    <main class="app-container">

        <section class="conversation-panel">
            <header class="panel-header">
                <div class="brand-heading">
                    <div class="brand-line">
                        <img class="brand-logo" src="/static/sia-logo.png" alt="SIA Interactive">
                        <p class="eyebrow"><span class="brand-mark" aria-hidden="true"></span>SELF ORDER</p>
                    </div>
                    <h1>Hace tu pedido<span class="heading-accent">.</span></h1>
                    <p class="header-subtitle">Pedí hablando o escribiendo. Te acompañamos hasta el retiro.</p>
                </div>

                <div id="system-status" class="status status-ready">
                    Listo
                </div>
            </header>

            <div id="conversation" class="conversation">
                <div class="message assistant-message">
                    <span class="message-author">
                        Asistente
                    </span>

                    <p>
                        Hola. Podés escribir tu pedido o tocar Hablar para comenzar.
                    </p>
                </div>
            </div>

            <p id="voice-transcript" class="voice-transcript" role="status" aria-live="polite"></p>

            <form id="message-form" class="message-form">
                <button id="mic-button" class="control-button" type="button" title="Hablar y luego enviar el audio">
                    🎤 Hablar
                </button>
                <input id="message-input" type="text" autocomplete="off"
                    placeholder="Ej.: Quiero un Big Mac grande con Coca">

                <button id="send-button" type="submit">
                    Enviar
                </button>
                <button id="audio-button" class="control-button" type="button"
                    title="Activar o desactivar la voz del asistente">
                    🔊 Voz ON
                </button>
            </form>
        </section>


        <aside class="cart-panel">
            <header class="cart-header">
                <div>
                    <p class="eyebrow">TU PEDIDO</p>
                    <h2>Carrito</h2>
                </div>

                <span id="session-state" class="session-state">
                    ACTIVE
                </span>
            </header>

            <div id="cart-items" class="cart-items">
                <p class="empty-cart">
                    Tu carrito está vacío.
                </p>
            </div>

            <footer class="cart-footer">
                <div class="total-row">
                    <span>Total</span>

                    <strong id="cart-total">
                        ARS 0
                    </strong>
                </div>
                <button id="confirm-cart-button" class="payment-action" type="button" hidden>
                    CONFIRMAR PEDIDO
                </button>
            </footer>

            <section id="payment-panel" class="payment-panel" hidden>
                <h3>Elegí cómo pagar</h3>
                <div class="payment-options">
                    <button type="button" data-payment-method="QR">QR</button>
                    <button type="button" data-payment-method="CARD">Tarjeta</button>
                    <button type="button" data-payment-method="CASH">En caja</button>
                </div>
                <div id="payment-content"></div>
            </section>
        </aside>

    </main>

    <script type="module" src="/static/app.js?v=20260917-2"></script>
</body>

</html>
